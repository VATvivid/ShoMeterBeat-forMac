name: macOS build

on:
  push:
    branches: [mac-port]
  workflow_dispatch:

jobs:
  build:
    # Apple Silicon (arm64) standard runner — matches the target Macs. Free on public repos and within
    # the included compute on a personal (non-enterprise) GitHub account. (On an enterprise-managed
    # account macOS runners are policy-gated and this job just queues; run it from a personal account.)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # whisper.cpp needs cmake (preinstalled on macOS runners) + libclang (from Xcode's clang).
      - name: Toolchain versions
        run: |
          cmake --version
          clang --version

      # whisper-rs-sys runs bindgen, which needs libclang (bindgen panics "Unable to find libclang" otherwise).
      # Xcode's toolchain ships one; point LIBCLANG_PATH at it and give clang the SDK sysroot for system headers.
      - name: libclang for bindgen (whisper-rs)
        run: |
          DEV="$(xcode-select -p)"
          for d in "$DEV/Toolchains/XcodeDefault.xctoolchain/usr/lib" "$DEV/usr/lib" "$(brew --prefix llvm 2>/dev/null)/lib"; do
            if [ -f "$d/libclang.dylib" ]; then echo "LIBCLANG_PATH=$d" >> "$GITHUB_ENV"; echo "libclang: $d"; FOUND=1; break; fi
          done
          if [ -z "${FOUND:-}" ]; then brew install llvm; echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"; fi
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          # src-tauri/.cargo/config.toml carries Windows-only [env] values (VS cmake.exe path, MSVC /O2 /arch:AVX2
          # flags, x86 GGML_AVX* switches). Cargo [env] never overrides variables already set, so set the macOS
          # equivalents here: real cmake, clang flags, x86-only ggml options off (arm64 uses NEON automatically).
          {
            echo "CMAKE=$(command -v cmake)"
            echo "CMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG"
            echo "CMAKE_C_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG"
            for v in GGML_AVX GGML_AVX2 GGML_FMA GGML_F16C GGML_SSE42 GGML_BMI2; do echo "$v=OFF"; done
            echo "GGML_NATIVE=OFF"
          } >> "$GITHUB_ENV"

      # whisper base/small + yamnet/nmp into src-tauri/models/ (ONNX Runtime itself comes from the ort crate)
      - name: Fetch models
        run: |
          python3 -I -X utf8 scripts/fetch_models.py --whisper base
          python3 -I -X utf8 scripts/fetch_models.py --whisper small
          ls -la src-tauri/models

      # ShowMeterBeat Send plugin as macOS .clap/.vst3 bundles → src-tauri/plugins (shipped in the .dmg)
      - name: Build DAW Send plugin (CLAP + VST3)
        # a plugin build problem must not block the app .dmg; the app still builds without the plugin
        continue-on-error: true
        run: python3 -I -X utf8 scripts/bundle_plugin_macos.py

      - name: Install JS deps
        run: npm install

      - name: Build macOS app (.dmg)
        run: |
          set -o pipefail
          npx tauri build --config src-tauri/tauri.macos.conf.json 2>&1 | tee build.log

      # The step log needs auth to read; on failure replay the cause as annotations (visible via the API).
      - name: Surface build errors
        if: failure()
        run: |
          grep -nE "^error|error\[E|error:|failed to run custom build|CMake Error|panicked|could not compile|download" build.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          echo "::error::--- last 14 lines of build.log ---"
          tail -14 build.log | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      # no Apple Developer account: ad-hoc sign so the unsigned app opens (Gatekeeper still prompts once)
      - name: Ad-hoc sign .app
        run: codesign --force --deep -s - src-tauri/target/release/bundle/macos/ShowMeterBeat.app || true

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ShowMeterBeat-macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload .app (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShowMeterBeat-macos-arm64-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
