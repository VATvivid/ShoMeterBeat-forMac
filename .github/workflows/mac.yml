name: macOS build

on:
  push:
    branches: [mac-port]
  workflow_dispatch:

jobs:
  build:
    # Apple Silicon (arm64) standard runner — matches the target Macs. Free on public repos and within
    # the included compute on a personal (non-enterprise) GitHub account. (On an enterprise-managed
    # account macOS runners are policy-gated and this job just queues; run it from a personal account.)
    runs-on: macos-latest
    # contents:write — the dmg is published to a GitHub Release (public download, no GitHub login needed;
    # Actions artifacts need a login and api.github.com is blocked on the office network).
    permissions:
      contents: write
    # ScreenCaptureKit system-audio capture (mac-syscapture) is a default feature now that it builds and
    # passes the runtime smoke; one variant only.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # whisper.cpp needs cmake (preinstalled on macOS runners) + libclang (from Xcode's clang).
      - name: Toolchain versions
        run: |
          cmake --version
          clang --version

      # whisper-rs-sys runs bindgen, which needs libclang (bindgen panics "Unable to find libclang" otherwise).
      # Xcode's toolchain ships one; point LIBCLANG_PATH at it and give clang the SDK sysroot for system headers.
      - name: libclang for bindgen (whisper-rs)
        run: |
          DEV="$(xcode-select -p)"
          for d in "$DEV/Toolchains/XcodeDefault.xctoolchain/usr/lib" "$DEV/usr/lib" "$(brew --prefix llvm 2>/dev/null)/lib"; do
            if [ -f "$d/libclang.dylib" ]; then echo "LIBCLANG_PATH=$d" >> "$GITHUB_ENV"; echo "libclang: $d"; FOUND=1; break; fi
          done
          if [ -z "${FOUND:-}" ]; then brew install llvm; echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"; fi
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          # src-tauri/.cargo/config.toml carries Windows-only [env] values (VS cmake.exe path, MSVC /O2 /arch:AVX2
          # flags, x86 GGML_AVX* switches). Cargo [env] never overrides variables already set, so set the macOS
          # equivalents here: real cmake, clang flags, x86-only ggml options off (arm64 uses NEON automatically).
          {
            echo "CMAKE=$(command -v cmake)"
            echo "CMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG"
            echo "CMAKE_C_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG"
            for v in GGML_AVX GGML_AVX2 GGML_FMA GGML_F16C GGML_SSE42 GGML_BMI2; do echo "$v=OFF"; done
            echo "GGML_NATIVE=OFF"
          } >> "$GITHUB_ENV"
          # ort's prebuilt ONNX Runtime (CoreML EP) uses @available → needs clang's compiler-rt builtins
          # (___isPlatformVersionAtLeast) which Rust's link step doesn't add by itself; link libclang_rt.osx.
          # Deployment target 14.0: the ORT objects are built for ≥13.4 and the target Macs run 14+.
          RT="$(clang -print-resource-dir)/lib/darwin"
          ls "$RT"/libclang_rt.osx.a
          echo "RUSTFLAGS=-C link-arg=-L$RT -C link-arg=-lclang_rt.osx" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      # whisper base/small + yamnet/nmp into src-tauri/models/ (ONNX Runtime itself comes from the ort crate)
      - name: Fetch models
        run: |
          python3 -I -X utf8 scripts/fetch_models.py --whisper base
          python3 -I -X utf8 scripts/fetch_models.py --whisper small
          ls -la src-tauri/models

      # ShowMeterBeat Send plugin as macOS .clap/.vst3 bundles → src-tauri/plugins (shipped in the .dmg)
      - name: Build DAW Send plugin (CLAP + VST3)
        # a plugin build problem must not block the app .dmg; the app still builds without the plugin
        continue-on-error: true
        run: python3 -I -X utf8 scripts/bundle_plugin_macos.py

      - name: Install JS deps
        run: npm install

      # No Apple Developer account → ad-hoc identity "-": the bundler seals the .app BEFORE the .dmg is built,
      # so the app inside the dmg is signed. An unsealed bundle downloaded on Apple Silicon is refused by
      # Gatekeeper as "damaged" with no override; an ad-hoc sealed one gets the "Open Anyway" path instead.
      # Notarization is skipped (no credentials); the dmg itself stays unsigned (bundler skips it for "-").
      # hardenedRuntime is off in tauri.macos.conf.json: it is only needed for notarization and would add
      # entitlement requirements (microphone etc.) to the ad-hoc build.
      - name: Build macOS app (.dmg)
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -o pipefail
          npx tauri build --config src-tauri/tauri.macos.conf.json 2>&1 | tee build.log

      # The step log needs auth to read; on failure replay the cause as annotations (visible via the API).
      - name: Surface build errors
        if: failure()
        run: |
          grep -nE "^error|error\[E|error:|failed to run custom build|CMake Error|panicked|could not compile|download" build.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          echo "::error::--- last 14 lines of build.log ---"
          tail -14 build.log | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      # Prove the seal is on the .app and on the copy inside the .dmg (the thing users actually download).
      - name: Verify ad-hoc signature (.app and inside .dmg)
        run: |
          APP=src-tauri/target/release/bundle/macos/ShowMeterBeat.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "^(Identifier|Signature|CodeDirectory|Sealed Resources)" || true
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          MNT="$(hdiutil attach -nobrowse -readonly "$DMG" | grep -o '/Volumes/.*' | head -1)"
          echo "mounted: $MNT"; ls "$MNT"
          codesign --verify --deep --strict --verbose=2 "$MNT/ShowMeterBeat.app"
          echo "::notice::ad-hoc signature verified on .app and inside $(basename "$DMG")"
          hdiutil detach "$MNT"

      # Runtime smoke on the (real) macOS runner: the POSIX shared-memory bridge round-trips in-process,
      # and the built .app launches and stays alive for 30 s; its log is replayed (RUST_LOG=info) so
      # model-loading / capture errors show up here without needing a Mac in hand.
      - name: Runtime smoke (rm-shm tests + launch app)
        run: |
          set +e
          echo "== rm-shm tests (POSIX shm_open/mmap) =="
          (cd crates/rm-shm && cargo test --release 2>&1 | tail -12); T=${PIPESTATUS[0]}
          APP=src-tauri/target/release/bundle/macos/ShowMeterBeat.app
          BIN="$(ls "$APP"/Contents/MacOS/* | head -1)"
          echo "== bundle =="; file "$BIN"; ls "$APP/Contents/Resources" | head -40
          echo "== launch $BIN =="
          RUST_LOG=info "$BIN" > app.log 2>&1 &
          PID=$!; sleep 30
          if kill -0 "$PID" 2>/dev/null; then ALIVE=1; else ALIVE=0; fi
          kill "$PID" 2>/dev/null; sleep 1
          echo "== app.log =="; tail -80 app.log
          echo "::notice::runtime smoke — app alive after 30s: $ALIVE, rm-shm tests exit: $T"
          grep -iE "panick|error|실패|failed|denied" app.log | head -12 | while IFS= read -r l; do echo "::warning::app.log: ${l:0:900}"; done
          [ "$ALIVE" = "1" ] && [ "$T" = "0" ]

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ShowMeterBeat-macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Public download link: https://github.com/<owner>/<repo>/releases/download/mac-v<version>/<dmg>
      # One release per app version (tag mac-v<version>); a rebuild of the same version replaces the asset.
      - name: Publish .dmg to GitHub Release
        id: relinfo
        run: |
          V="$(node -p "require('./package.json').version")"
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DMG" | tee dmg.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ steps.relinfo.outputs.version }}
          name: ShowMeterBeat ${{ steps.relinfo.outputs.version }} (macOS Apple Silicon)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ${{ steps.relinfo.outputs.dmg }}
            dmg.sha256
          body: |
            ShowMeterBeat ${{ steps.relinfo.outputs.version }} — macOS 14 이상, Apple Silicon(arm64). 빌드 커밋 `${{ github.sha }}`.

            설치: `${{ steps.relinfo.outputs.dmg_name }}`을 열고 ShowMeterBeat를 Applications로 끌어 놓습니다.
            첫 실행에서 "확인되지 않은 개발자" 경고가 뜨면 시스템 설정 → 개인정보 보호 및 보안 → **그래도 열기**를 한 번 누릅니다(ad-hoc 서명, Apple 공증 없음).
            "손상되어 열 수 없음"이 뜨면 터미널에서 `xattr -cr /Applications/ShowMeterBeat.app` 후 다시 엽니다.
            처음 소리를 받을 때 화면 기록 권한을 허용한 뒤 장치를 다시 고르면 미터가 움직입니다.

      - name: Upload .app (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShowMeterBeat-macos-arm64-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
