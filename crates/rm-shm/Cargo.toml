[package]
name = "rm-shm"
version = "0.1.0"
edition = "2021"
description = "Shared-memory audio bridge between the ShowMeterBeat Send plugin and the app"

# Win32 named file mapping on Windows; POSIX shm_open + mmap (via libc) on macOS / Linux.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
