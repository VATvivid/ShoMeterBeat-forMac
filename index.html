<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowMeterBeat</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="tb-group">
        <span class="app-name">ShowMeterBeat</span>
      </div>
      <div class="tb-group">
        <select id="device-select" title="캡처 장치"></select>
      </div>
      <div class="tb-group">
        <button id="rec-btn" class="btn rec" title="시스템 소리를 WAV로 녹음 (시작/중지·저장)">● 녹음</button>
        <span id="rec-time" class="rec-time hidden">00:00</span>
      </div>
      <div class="tb-group tb-right">
        <div class="menu">
          <button id="modules-btn" class="btn" title="모듈 켜기/끄기">모듈 ▾</button>
          <div id="modules-panel" class="popover hidden"></div>
        </div>
        <button id="edit-btn" class="btn" title="레이아웃 편집 (드래그로 이동, 모서리로 크기)">레이아웃 편집</button>
        <div class="menu">
          <button id="dock-btn" class="btn" title="창을 화면 가장자리에 띠 모양으로 붙이기">도킹 ▾</button>
          <div id="dock-panel" class="popover hidden"></div>
        </div>
        <div class="menu">
          <button id="preset-btn" class="btn" title="배치·설정·도킹 프리셋 (Ctrl+1~9로 바로 적용)">프리셋 ▾</button>
          <div id="preset-panel" class="popover hidden"></div>
        </div>
        <div class="menu">
          <button id="win-btn" class="btn" title="항상 위·투명도·별도 창·창 찾기">창 ▾</button>
          <div id="win-panel" class="popover hidden"></div>
        </div>
        <button id="reset-layout-btn" class="btn" title="기본 배치로 되돌리기">기본 배치</button>
        <button id="install-plugin-btn" class="btn" title="DAW용 'ShowMeterBeat Send' 플러그인(CLAP·VST3)을 사용자 플러그인 폴더에 복사">플러그인 설치</button>
      </div>
    </header>
    <main id="grid"></main>
    <footer id="statusbar">
      <span id="st-device">장치 —</span>
      <span class="sep">·</span>
      <span id="st-rate">— Hz</span>
      <span class="sep">·</span>
      <span id="st-fps">— fps</span>
      <span class="sep">·</span>
      <span id="st-state">대기</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
