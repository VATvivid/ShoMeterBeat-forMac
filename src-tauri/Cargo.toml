[package]
name = "re-minimeter"
version = "0.1.0"
description = "System-audio visual analyzer and loudness meter for Windows"
authors = ["VATvivid"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "re_minimeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
rustfft = "6"
ebur128 = "0.1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
