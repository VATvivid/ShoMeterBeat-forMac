[package]
name = "showmeterbeat"
version = "1.0.0"
description = "System-audio visual analyzer and loudness meter for Windows"
authors = ["VATvivid"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "showmeterbeat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
raw-window-handle = "0.6"
hound = "3"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray"] }
whisper-rs = { version = "0.16", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac"] }
rm-shm = { path = "../crates/rm-shm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
rustfft = "6"
ebur128 = "0.1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[features]
default = []
# Live subtitles (whisper.cpp). Needs CMake + LLVM/libclang at build time:
#   npm run tauri build -- --features subtitles
subtitles = ["dep:whisper-rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
